name: TaskForge - Docker Publish

on:
  workflow_run:
    workflows: ["TaskForge - GitHub Actions CI"]
    types: [completed]
    branches: [main, docker]

permissions:
  contents: read

jobs:
  docker-publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') }}

    steps:
      # Step 1: Check out the exact commit that passed CI
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and push image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # tags: |
          #   ${{ secrets.DOCKERHUB_USERNAME }}/taskforge:latest
          #   ${{ secrets.DOCKERHUB_USERNAME }}/taskforge:sha-${{ github.event.workflow_run.head_sha }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=raw,value=latest
          cache-from: type=gha
          cache-to: type=gha,mode=max